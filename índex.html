<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Corazón Animado</title>
  <style>
    body {
      margin: 0;
      background-color: black;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    canvas {
      background-color: black;
    }
  </style>
</head>
<body>
  <canvas id="heartCanvas"></canvas>

  <script>
    const canvas = document.getElementById('heartCanvas');
    const ctx = canvas.getContext('2d');

    // Ajustar el tamaño al celular/pantalla
    const size = Math.min(window.innerWidth, window.innerHeight) * 0.9;
    canvas.width = size;
    canvas.height = size;

    ctx.strokeStyle = "red";
    ctx.lineWidth = 2;

    function heart(n) {
      const x = 15 * Math.pow(Math.sin(n), 3);
      const y = 12 * Math.cos(n) - 5 * Math.cos(2*n) - 2 * Math.cos(3*n) - Math.cos(4*n);
      return { x, y };
    }

    // Mapear coordenadas de la pantalla (centrar el origen)
    function toScreen(x, y, scale) {
      return {
        x: canvas.width / 2 + x * scale,
        y: canvas.height / 2 - y * scale // En la web la Y está invertida
      };
    }

    let i = 1;
    let j = 0;
    const scale = size / 550; // Escala adaptativa para celulares

    function animate() {
      if (i > 15) return; // Terminar animación al llegar a 15 capas

      const n = j / 10;
      const point = heart(n);
      const pos = toScreen(point.x * i, point.y * i, scale);

      if (j === 0) {
        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y);
      } else {
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
      }

      j++;
      if (j > 63) { // Vuelta completa (~2*pi)
        j = 0;
        i++;
      }

      setTimeout(() => requestAnimationFrame(animate), 10); // Control de velocidad
    }

    animate();
  </script>
</body>
</html>
